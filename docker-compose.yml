# ===========================================
# 🚀 Trends Intelligence - Docker Compose
# ===========================================
# Uso:
#   Produção:     docker compose up -d
#   Dev:          docker compose --profile dev up
#   Logs:         docker compose logs -f [service]
#   Rebuild:      docker compose build --no-cache
# ===========================================

services:
  # =========================================
  # 🗄️ MongoDB
  # =========================================
  mongo:
    image: mongo:7
    container_name: trends_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-trends}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-trends_secret}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_USER:-trends}", "-p", "${MONGO_PASSWORD:-trends_secret}", "--authenticationDatabase", "admin", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================
  # 🔴 Redis
  # =========================================
  redis:
    image: redis:7-alpine
    container_name: trends_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================
  # 🚀 API (FastAPI)
  # =========================================
  api:
    build:
      context: ./backend
      target: production
    container_name: trends_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://${MONGO_USER:-trends}:${MONGO_PASSWORD:-trends_secret}@mongo:27017
      MONGO_DB: ${MONGO_DB:-trends}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      API_KEY: ${API_KEY:?defina API_KEY no .env da raiz}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost}
    ports:
      - "8000:8000"
    networks:
      - backend
      - frontend
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # =========================================
  # ⚙️ Worker (Celery)
  # =========================================
  worker:
    build:
      context: ./backend
      target: production
    container_name: trends_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://${MONGO_USER:-trends}:${MONGO_PASSWORD:-trends_secret}@mongo:27017
      MONGO_DB: ${MONGO_DB:-trends}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
    command: celery -A apps.worker.main.celery_app worker --loglevel=info --concurrency=2 -Q celery,ml,tiktok,trend
    networks:
      - backend
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # =========================================
  # ⏰ Beat (Celery Scheduler)
  # =========================================
  beat:
    build:
      context: ./backend
      target: production
    container_name: trends_beat
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
    command: celery -A apps.worker.main.celery_app beat --loglevel=info
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================
  # 🌐 Web (Frontend - Produção)
  # =========================================
  web:
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    container_name: trends_web
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - frontend
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================
  # 🔧 Web Dev (Frontend - Desenvolvimento)
  # =========================================
  web-dev:
    build:
      context: ./frontend
      target: development
    container_name: trends_web_dev
    profiles:
      - dev
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - frontend
    depends_on:
      - api

# =========================================
# 🔗 Networks
# =========================================
networks:
  backend:
    driver: bridge
    name: trends_backend
  frontend:
    driver: bridge
    name: trends_frontend

# =========================================
# 💾 Volumes
# =========================================
volumes:
  mongo_data:
    name: trends_mongo_data
  redis_data:
    name: trends_redis_data