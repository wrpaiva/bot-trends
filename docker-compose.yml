# ===========================================
# 🚀 Trends Intelligence - Docker Compose
# ===========================================
# Uso:
#   Produção:     docker compose up -d
#   Dev:          docker compose --profile dev up
#   Logs:         docker compose logs -f [service]
#   Rebuild:      docker compose build --no-cache
# ===========================================

services:
  # =========================================
  # 🗄️ MongoDB
  # =========================================
  mongo:
    image: mongo:7
    container_name: trends_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-trends}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-trends_secret}
    # Só o loopback, e porta configurável: o Mongo é consumido pela rede
    # interna do compose; publicar em 0.0.0.0 expõe o banco à rede toda.
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_USER:-trends}", "-p", "${MONGO_PASSWORD:-trends_secret}", "--authenticationDatabase", "admin", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================
  # 🔴 Redis
  # =========================================
  redis:
    image: redis:7-alpine
    container_name: trends_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================
  # 🚀 API (FastAPI)
  # =========================================
  api:
    build:
      context: ./backend
      target: production
    container_name: trends_api
    restart: unless-stopped
    # PID 1 = tini, a API é filho comum: o healthcheck consegue encerrá-la
    # quando trava, e o restart policy a sobe de novo (TIE-38)
    init: true
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://${MONGO_USER:-trends}:${MONGO_PASSWORD:-trends_secret}@mongo:27017
      MONGO_DB: ${MONGO_DB:-trends}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      API_KEY: ${API_KEY:?defina API_KEY no .env da raiz}
      # O dashboard fala com a API pela mesma origem (proxy /api, TIE-27) e não
      # precisa de CORS. Só liste aqui outra origem de browser que chame a API direto.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    networks:
      - backend
      - frontend
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # =========================================
  # ⚙️ Worker (Celery)
  # =========================================
  worker:
    build:
      context: ./backend
      target: production
    container_name: trends_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://${MONGO_USER:-trends}:${MONGO_PASSWORD:-trends_secret}@mongo:27017
      MONGO_DB: ${MONGO_DB:-trends}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
    command: celery -A apps.worker.main.celery_app worker --loglevel=info --concurrency=2 -Q celery,ml,tiktok,trend
    # Heartbeat real do Celery, no lugar do curl HTTP herdado da imagem (TIE-38).
    # $$HOSTNAME: o nome do nó do worker é celery@<hostname do container>.
    healthcheck:
      test: ["CMD-SHELL", "celery -A apps.worker.main.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 30s
      start_period: 30s
      retries: 3
    networks:
      - backend
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # =========================================
  # ⏰ Beat (Celery Scheduler)
  # =========================================
  beat:
    build:
      context: ./backend
      target: production
    container_name: trends_beat
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
    # Agendamento num volume: sem ele, recriar o container (todo deploy) zera o
    # celerybeat-schedule e cada task só roda um intervalo inteiro depois da
    # subida — o collect_ml (6 h) ficava 6 h parado a cada `up -d --build`.
    command: celery -A apps.worker.main.celery_app beat --loglevel=info --schedule /app/beat/celerybeat-schedule
    volumes:
      - beat_data:/app/beat
    # O beat não serve HTTP nem responde a ping; o curl herdado da imagem o
    # marcava unhealthy à toa. Vivo = processo rodando (restart: unless-stopped).
    healthcheck:
      disable: true
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================
  # 🌐 Web (Frontend - Produção)
  # =========================================
  web:
    build:
      context: ./frontend
      target: production
    container_name: trends_web
    restart: unless-stopped
    # O nginx repassa /api para a API e põe a X-API-Key (TIE-27). A chave fica
    # no ambiente do container, em runtime — não no bundle nem no build.
    environment:
      API_KEY: ${API_KEY:?defina API_KEY no .env da raiz}
    ports:
      - "${WEB_HOST_PORT:-80}:80"
    networks:
      - frontend
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================
  # 🔧 Web Dev (Frontend - Desenvolvimento)
  # =========================================
  web-dev:
    build:
      context: ./frontend
      target: development
    container_name: trends_web_dev
    profiles:
      - dev
    # Proxy do Vite faz o papel do nginx: /api → api:8000 com a X-API-Key (TIE-27)
    environment:
      API_KEY: ${API_KEY:?defina API_KEY no .env da raiz}
      API_PROXY_TARGET: http://api:8000
    ports:
      - "${WEB_DEV_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - frontend
    depends_on:
      - api

  # =========================================
  # 💾 Backup do Mongo (TIE-35)
  # =========================================
  # mongodump diário para BACKUP_HOST_DIR, com retenção e registro em
  # `backups` (o check de saúde alerta se falhar). Para tirar da máquina, aponte
  # BACKUP_HOST_DIR para um disco/NAS montado ou use BACKUP_UPLOAD_CMD.
  # Restauração testada: infra/backup/restore_test.sh (ver README).
  backup:
    image: mongo:7
    container_name: trends_backup
    restart: unless-stopped
    entrypoint: ["bash", "/backup/backup-loop.sh"]
    # Arquivos com o dono do host, não root (mesma armadilha do __pycache__)
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      HOME: /tmp
      MONGO_URI: mongodb://${MONGO_USER:-trends}:${MONGO_PASSWORD:-trends_secret}@mongo:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB:-trends}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-3}
      BACKUP_UPLOAD_CMD: ${BACKUP_UPLOAD_CMD:-}
    volumes:
      - ./infra/backup:/backup:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - backend

  # =========================================
  # 📈 Observabilidade (TIE-36) — profile `observability`
  # =========================================
  # Fora do `up` normal: docker compose --profile observability up -d
  # Prometheus coleta o /metrics da API (com X-API-Key) e avalia as regras de
  # infra/observability/prometheus/alerts.yml; o Grafana sobe com o datasource
  # e o dashboard "Trends — visão geral" já provisionados. Só em 127.0.0.1.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: trends_prometheus
    profiles:
      - observability
    restart: unless-stopped
    # A chave vai para um arquivo lido pelo scrape (o Prometheus não expande
    # variável de ambiente na config). $$ = $ literal para o shell do container.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        printf '%s' "$$API_KEY" > /tmp/api_key &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=$$PROMETHEUS_RETENTION
    environment:
      API_KEY: ${API_KEY:?defina API_KEY no .env da raiz}
      PROMETHEUS_RETENTION: ${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./infra/observability/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    networks:
      - backend
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.1.1
    container_name: trends_grafana
    profiles:
      - observability
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Sem GRAFANA_ADMIN_PASSWORD, "admin" — o Grafana pede troca no 1º login
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/trends-overview.json
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    networks:
      - backend
    depends_on:
      - prometheus

# =========================================
# 🔗 Networks
# =========================================
networks:
  backend:
    driver: bridge
    name: trends_backend
  frontend:
    driver: bridge
    name: trends_frontend

# =========================================
# 💾 Volumes
# =========================================
volumes:
  mongo_data:
    name: trends_mongo_data
  redis_data:
    name: trends_redis_data
  beat_data:
    name: trends_beat_data
  prometheus_data:
    name: trends_prometheus_data
  grafana_data:
    name: trends_grafana_data