# Prometheus do profile `observability` (TIE-36).
# Coleta o GET /metrics da API, que exige X-API-Key: o entrypoint do serviço
# grava a chave em /tmp/api_key a partir do API_KEY do .env da raiz — a chave
# não fica neste arquivo (o Prometheus não expande variável de ambiente).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: trends_api
    metrics_path: /metrics
    http_headers:
      X-API-Key:
        files: [/tmp/api_key]
    static_configs:
      - targets: ["api:8000"]
